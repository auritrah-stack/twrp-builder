name: Build TWRP for Symphony Z35
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32readline-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python-is-python3 cpio repo
          df -h

      - name: Configure Git
        run: |
          git config --global user.name "TWRP Builder"
          git config --global user.email "builder@example.com"

      - name: Sync TWRP 11 Minimal Manifest
        run: |
          mkdir -p ~/twrp && cd ~/twrp
          repo init --depth=1 -u https://github.com -b twrp-11
          repo sync -j$(nproc --all) --force-sync --no-clone-bundle --no-tags

      - name: Clone Symphony Z35 Device Tree
        run: |
          git clone https://github.com ~/twrp/device/symphony/Z35

      - name: Compile TWRP Recovery
        run: |
          cd ~/twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          source build/envsetup.sh
          lunch omni_Z35-eng
          mka recoveryimage -j$(nproc --all)

      - name: Upload Finished Recovery Image
        uses: actions/upload-artifact@v4
        with:
          name: TWRP-Symphony-Z35
          path: ~/twrp/out/target/product/Z35/recovery.img
