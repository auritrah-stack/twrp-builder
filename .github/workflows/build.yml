name: Build OrangeFox Recovery

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Compile OrangeFox for Symphony Z35
    runs-on: ubuntu-22.04          # NOT ubuntu-latest (24.04 breaks the 12.1 toolchain)
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FOX_BUILD_DEVICE: Z35

      # ---- Size reduction (image was 39,471,104 B, limit is 33,484,800 B) ----
      FOX_USE_LZMA_COMPRESSION: "1"      # biggest saver (needs CONFIG_RD_LZMA=y in kernel)
      LZMA_RAMDISK_TARGETS: "recovery"
      FOX_DELETE_AROMAFM: "1"
      FOX_REMOVE_AAPT: "1"
      FOX_EXCLUDE_NANO_EDITOR: "1"
      FOX_ENABLE_APP_MANAGER: "0"
      OF_SKIP_MULTIPLE_LANGUAGES: "1"

    steps:
      - name: Checkout Device Tree
        uses: actions/checkout@v4

      - name: Build OrangeFox Recovery
        uses: UWU-TEAM/UWU-OrangeFox-Builder@v1.0.0
        with:
          USER_NAME: 'auritrah-stack'
          USER_EMAIL: 'auritrah-stack@users.noreply.github.com'
          FOX_SYNC_BRANCH: '12.1'
          DEVICE_TREE: 'https://github.com/auritrah-stack/android_device_symphony_Z35'
          DEVICE_TREE_BRANCH: 'main'
          DEVICE_PATH: 'device/symphony/Z35'
          DEVICE_NAME: 'Z35'
          BUILD_TARGET: 'recovery'      # this phone has a real recovery partition
          GH_RELEASE: 'true'
