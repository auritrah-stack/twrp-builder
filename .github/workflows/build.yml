name: Build Symphony Z35 TWRP 12.1

on:
  workflow_dispatch:
    inputs:
      device_tree_ref:
        description: 'Branch, tag, or commit of auritrah-stack/twrp_device_symphony_Z35'
        required: true
        default: main
        type: string
      build_jobs:
        description: 'Parallel build jobs (keep at 4 on a 16 GB runner)'
        required: true
        default: '4'
        type: choice
        options:
          - '2'
          - '4'
          - '6'

permissions:
  contents: read

env:
  MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
  MANIFEST_BRANCH: twrp-12.1
  DEVICE_TREE_REPOSITORY: auritrah-stack/twrp_device_symphony_Z35
  DEVICE_TREE_CHECKOUT_DIR: ${{ github.workspace }}/device-tree/Z35
  DEVICE_TREE_DIR: ${{ github.workspace }}/twrp/device/symphony/Z35
  SOURCE_DIR: ${{ github.workspace }}/twrp
  ARTIFACT_DIR: ${{ github.workspace }}/z35-build-artifacts
  MAX_RECOVERY_BYTES: '33554432'
  SYNC_JOBS: '4'

concurrency:
  group: z35-twrp-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # Set Z35_RUNNER_LABEL only when selecting a custom/self-hosted runner.
    # The workflow reclaims unused tools on ephemeral GitHub-hosted runners.
    runs-on: ${{ vars.Z35_RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 360

    steps:
      - name: Check out the Z35 device tree
        uses: actions/checkout@v4
        with:
          repository: auritrah-stack/twrp_device_symphony_Z35
          ref: ${{ inputs.device_tree_ref }}
          # Keep the source checkout separate until repo sync is complete.
          # The repository has a top-level Z35/ directory.
          path: device-tree
          fetch-depth: 1
          persist-credentials: false

      - name: Reclaim unused space on ephemeral GitHub-hosted runner
        shell: bash
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -Eeuo pipefail
          echo '=== Disk before cleanup ==='
          df -h "$GITHUB_WORKSPACE"

          if [[ "$RUNNER_ENVIRONMENT" == 'github-hosted' ]]; then
            # These preinstalled toolchains are not used by this workflow.
            # Do not run this destructive cleanup on a self-hosted runner.
            sudo rm -rf \
              /usr/local/lib/android \
              /usr/share/dotnet \
              /opt/ghc \
              /usr/local/.ghcup \
              /usr/share/swift \
              /opt/hostedtoolcache \
              /usr/local/share/powershell \
              /usr/local/share/chromium \
              /usr/local/share/chromedriver
            sudo apt-get clean
            if command -v docker >/dev/null 2>&1; then
              sudo docker system prune --all --force --volumes || true
            fi
          else
            echo 'Self-hosted runner detected; skipping destructive disk cleanup.'
          fi

          echo '=== Disk after cleanup ==='
          df -h "$GITHUB_WORKSPACE"

      - name: Export manual build options
        shell: bash
        env:
          DEVICE_TREE_REF: ${{ inputs.device_tree_ref }}
          BUILD_JOBS: ${{ inputs.build_jobs }}
        run: |

