
name: Build TWRP for Symphony Z35

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build.yml"

permissions:
  contents: read

concurrency:
  group: twrp-z35-build
  cancel-in-progress: false

jobs:
  build:
    name: Compile TWRP 12.1
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      DEVICE_TREE_URL: https://github.com/auritrah-stack/twrp_device_symphony_Z35.git
      DEVICE_TREE_BRANCH: main
      MANIFEST_URL: https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git
      MANIFEST_BRANCH: twrp-12.1
      DEVICE_PATH: device/symphony/Z35
      DEVICE: Z35
      MAX_RECOVERY_SIZE: "33554432"

    steps:
      - name: Free disk space
        shell: bash
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo apt-get clean

          df -h /

          FREE=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')

          if [ "$FREE" -lt 65 ]; then
            echo "::error::Insufficient disk space: ${FREE} GB available."
            exit 1
          fi

      - name: Install dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            bc bison build-essential \
            ccache curl flex g++-multilib \
            gcc-multilib git git-lfs gnupg \
            gperf imagemagick lib32ncurses5-dev \
            lib32readline-dev lib32z1-dev \
            libc6-dev-i386 libelf-dev liblz4-tool \
            libncurses5-dev libsdl1.2-dev \
            libssl-dev libxml2 libxml2-utils \
            lzop openjdk-17-jdk \
            python3 python-is-python3 \
            rsync schedtool squashfs-tools \
            unzip x11proto-core-dev xsltproc \
            zip zlib1g-dev

          git lfs install
          java -version
          python3 --version

      - name: Install Repo tool
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -fsSL \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          "$HOME/bin/repo" version

      - name: Initialize TWRP source
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/twrp"

          cd "$GITHUB_WORKSPACE/twrp"

          repo init \
            --depth=1 \
            -u "$MANIFEST_URL" \
            -b "$MANIFEST_BRANCH"

      - name: Sync TWRP source
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/twrp"

          repo sync \
            -c \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            -j2 \
            --fail-fast

          test -f build/envsetup.sh

      - name: Download Symphony Z35 device tree
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/twrp"

          git clone \
            --depth=1 \
            --branch "$DEVICE_TREE_BRANCH" \
            "$DEVICE_TREE_URL" \
            "$GITHUB_WORKSPACE/device-tree"

          test -d "$GITHUB_WORKSPACE/device-tree/Z35"

          mkdir -p "$DEVICE_PATH"

          cp -a \
            "$GITHUB_WORKSPACE/device-tree/Z35/." \
            "$DEVICE_PATH/"

          echo "Device tree contents:"
          ls -la "$DEVICE_PATH"

      - name: Verify device tree and prebuilts
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/twrp"

          test -s "$DEVICE_PATH/BoardConfig.mk"
          test -s "$DEVICE_PATH/AndroidProducts.mk"
          test -s "$DEVICE_PATH/twrp_Z35.mk"
          test -s "$DEVICE_PATH/device.mk"
          test -s "$DEVICE_PATH/recovery.fstab"

          test -s "$DEVICE_PATH/prebuilt/kernel"
          test -s "$DEVICE_PATH/prebuilt/dtb.img"
          test -s "$DEVICE_PATH/prebuilt/dtbo.img"
          test -s "$DEVICE_PATH/prebuilt/SHA256SUMS"

          grep -q '^PRODUCT_NAME := twrp_Z35$' \
            "$DEVICE_PATH/twrp_Z35.mk"

          grep -q '^BOARD_RECOVERYIMAGE_PARTITION_SIZE := 33554432$' \
            "$DEVICE_PATH/BoardConfig.mk"

          grep -q '^BOARD_INCLUDE_RECOVERY_DTBO := true$' \
            "$DEVICE_PATH/BoardConfig.mk"

          (
            cd "$DEVICE_PATH"
            sha256sum -c prebuilt/SHA256SUMS
          )

          echo "Device tree and prebuilt checks passed."

      - name: Build TWRP recovery
        shell: bash
        run: |
          set -Eeuo pipefail

          mkdir -p "$GITHUB_WORKSPACE/build-logs"

          cd "$GITHUB_WORKSPACE/twrp"

          {
            export ALLOW_MISSING_DEPENDENCIES=true
            export USE_CCACHE=1
            export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache"
            export LC_ALL=C

            source build/envsetup.sh

            lunch twrp_Z35-eng

            echo "Starting TWRP recovery compilation..."

            mka -j2 recoveryimage

          } 2>&1 | tee "$GITHUB_WORKSPACE/build-logs/build.log"

      - name: Verify recovery image
        shell: bash
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/twrp"

          IMAGE="out/target/product/Z35/recovery.img"

          if [ ! -s "$IMAGE" ]; then
            echo "::error::TWRP did not produce recovery.img"
            find out/target/product/Z35 -maxdepth 1 -type f -name "*.img" -ls || true
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/recovery-artifacts"

          cp "$IMAGE" \
            "$GITHUB_WORKSPACE/recovery-artifacts/recovery.img"

          SIZE=$(stat -c%s "$IMAGE")

          echo "Recovery image size: $SIZE bytes"

          if [ "$SIZE" -gt "$MAX_RECOVERY_SIZE" ]; then
            echo "::error::Recovery image exceeds the 32 MiB partition."
            exit 1
          fi

          bash "$DEVICE_PATH/scripts/check-recovery-size.sh" "$IMAGE"

          python3 "$DEVICE_PATH/scripts/check-recovery-image.py" "$IMAGE"

          sha256sum "$IMAGE" \
            > "$GITHUB_WORKSPACE/recovery-artifacts/SHA256SUMS.txt"

          echo "All recovery image checks passed."

      - name: Upload TWRP recovery
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Symphony-Z35-TWRP-12.1
          path: recovery-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Symphony-Z35-TWRP-Build-Logs
          path: build-logs/
          if-no-files-found: warn
          retention-days: 14
